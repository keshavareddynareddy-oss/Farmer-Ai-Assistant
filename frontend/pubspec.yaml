name: crop_price_predictor
description: A Flutter app for crop price prediction and sell-time recommendations.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.4
  http: ^1.2.1
  fl_chart: ^0.68.0
  shared_preferences: ^2.2.2
  geolocator: ^13.0.2
  web: ^1.1.1
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2

flutter:
  uses-material-design: true
  generate: true
